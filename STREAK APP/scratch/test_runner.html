<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Streak App Tests</title>
</head>
<body>
  <h1>Streak App Unit Tests</h1>
  <div id="results"></div>

  <script src="../js/Streak.js"></script>
  <script src="../js/StreakStorage.js"></script>
  <script>
    const results = [];
    function assert(condition, message) {
      if (condition) {
        results.push({ pass: true, message });
      } else {
        results.push({ pass: false, message });
        console.error('FAIL:', message);
      }
    }

    try {
      // Test 1: New streak initialization
      const s1 = new Streak({ name: 'Cybersecurity Study' });
      assert(s1.currentStreak === 0, 'New streak current count is 0');
      assert(s1.bestStreak === 0, 'New streak best count is 0');
      assert(s1.startDate === null, 'New streak start date is null');
      assert(s1.getDisplayStreak('2026-09-21') === 0, 'Display streak is 0 before first check-in');

      // Test 2: First check-in
      const res1 = s1.checkIn('2026-09-21');
      assert(res1.success === true, 'First check-in succeeds');
      assert(s1.currentStreak === 1, 'Current streak is 1 after first check-in');
      assert(s1.bestStreak === 1, 'Best streak is 1 after first check-in');
      assert(s1.startDate === '2026-09-21', 'Start date recorded as check-in date');
      assert(s1.isCheckedInToday('2026-09-21') === true, 'isCheckedInToday returns true');
      assert(s1.getDisplayStreak('2026-09-21') === 1, 'Display streak is 1');

      // Test 3: Duplicate check-in rejected
      const dupRes = s1.checkIn('2026-09-21');
      assert(dupRes.success === false && dupRes.reason === 'ALREADY_CHECKED_IN', 'Duplicate check-in rejected');
      assert(s1.currentStreak === 1, 'Streak not incremented on duplicate');

      // Test 4: Consecutive day check-in increases streak
      const res2 = s1.checkIn('2026-09-22');
      assert(res2.success === true, 'Next day check-in succeeds');
      assert(s1.currentStreak === 2, 'Current streak incremented to 2');
      assert(s1.bestStreak === 2, 'Best streak incremented to 2');

      // Test 5: Day 3 consecutive check-in
      const res3 = s1.checkIn('2026-09-23');
      assert(res3.success === true, 'Day 3 check-in succeeds');
      assert(s1.currentStreak === 3, 'Current streak is 3');
      assert(s1.bestStreak === 3, 'Best streak is 3');

      // Test 6: Display streak before checking in on Day 4 (not lapsed)
      assert(s1.isCheckedInToday('2026-09-24') === false, 'Not checked in yet on day 4');
      assert(s1.getDisplayStreak('2026-09-24') === 3, 'Display streak still shows 3 awaiting today check-in');

      // Test 7: Missed day!
      assert(s1.getDisplayStreak('2026-09-25') === 0, 'Streak has lapsed, so display streak is 0 before check-in');
      const resMissed = s1.checkIn('2026-09-25');
      assert(resMissed.success === true, 'Check-in after missed day succeeds');
      assert(s1.currentStreak === 1, 'Streak resets to 1 after missing a day');
      assert(s1.bestStreak === 3, 'Historical best streak remains intact at 3');
      assert(s1.startDate === '2026-09-21', 'Original start date preserved');

      // Test 8: Renaming streak
      const renameRes = s1.rename('Advanced C#');
      assert(renameRes === true && s1.name === 'Advanced C#', 'Rename succeeds');
      assert(s1.currentStreak === 1, 'Current streak unaffected by rename');
      assert(s1.bestStreak === 3, 'Best streak unaffected by rename');

      // Test 9: Empty rename rejected
      const emptyRename = s1.rename('   ');
      assert(emptyRename === false, 'Empty or whitespace rename rejected');
      assert(s1.name === 'Advanced C#', 'Name preserved after empty rename rejection');

      // Test 10: Serialization & Deserialization
      const json = s1.toJSON();
      const s2 = Streak.fromJSON(json);
      assert(s2.name === 'Advanced C#', 'Hydrated name matches');
      assert(s2.currentStreak === 1, 'Hydrated current streak matches');
      assert(s2.bestStreak === 3, 'Hydrated best streak matches');
      assert(s2.startDate === '2026-09-21', 'Hydrated start date matches');
      assert(s2.lastCheckInDate === '2026-09-25', 'Hydrated lastCheckInDate matches');
      assert(s2.history.length === 4, 'Hydrated history length matches');

      // Test 11: Weekly status
      const weekly = s2.getWeeklyStatus('2026-09-25');
      assert(weekly.length === 7, 'Weekly status contains 7 days');
      assert(weekly[0].dayLabel === 'M' && weekly[0].dateStr === '2026-09-21', 'Monday is 2026-09-21');
      assert(weekly[0].isCompleted === true, 'Monday was completed');
      assert(weekly[1].isCompleted === true, 'Tuesday was completed');
      assert(weekly[2].isCompleted === true, 'Wednesday was completed');
      assert(weekly[3].isCompleted === false, 'Thursday was missed (incomplete)');
      assert(weekly[4].isCompleted === true, 'Friday is completed');
      assert(weekly[4].isToday === true, 'Friday is today');
      assert(weekly[5].isFuture === true && weekly[5].isCompleted === false, 'Saturday is future and not completed');
      assert(weekly[6].isFuture === true && weekly[6].isCompleted === false, 'Sunday is future and not completed');

      // Test 12: StreakStorage
      const storage = new StreakStorage('streak_test_storage');
      storage.clear();
      assert(storage.hasSavedStreak() === false, 'Storage is empty initially');
      assert(storage.load() === null, 'Storage load returns null when empty');
      storage.save(s2);
      assert(storage.hasSavedStreak() === true, 'Storage has saved streak');
      const loadedStreak = storage.load();
      assert(loadedStreak.name === 'Advanced C#', 'Loaded streak matches name');
      assert(loadedStreak.bestStreak === 3, 'Loaded streak matches bestStreak');
      storage.clear();
      assert(storage.hasSavedStreak() === false, 'Storage cleared successfully');

      const passCount = results.filter(r => r.pass).length;
      const failCount = results.filter(r => !r.pass).length;
      document.getElementById('results').innerText = `TOTAL: ${results.length}, PASSED: ${passCount}, FAILED: ${failCount}\n` +
        results.map(r => `${r.pass ? 'PASS' : 'FAIL'}: ${r.message}`).join('\n');
    } catch (err) {
      document.getElementById('results').innerText = 'ERROR: ' + err.toString();
    }
  </script>
</body>
</html>
