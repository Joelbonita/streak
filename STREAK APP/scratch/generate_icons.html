<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
<canvas id="c192" width="192" height="192"></canvas>
<canvas id="c512" width="512" height="512"></canvas>
<canvas id="cm192" width="192" height="192"></canvas>
<canvas id="cm512" width="512" height="512"></canvas>

<script>
function drawIcon(canvasId, size, isMaskable) {
  const canvas = document.getElementById(canvasId);
  const ctx = canvas.getContext('2d');

  // Background
  ctx.fillStyle = '#0B1120';
  ctx.fillRect(0, 0, size, size);

  // Subtle circular gradient glow in center
  const center = size / 2;
  const glowRadius = size * 0.45;
  const glow = ctx.createRadialGradient(center, center, 0, center, center, glowRadius);
  glow.addColorStop(0, 'rgba(45, 212, 191, 0.18)');
  glow.addColorStop(1, 'rgba(11, 17, 32, 0)');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(center, center, glowRadius, 0, Math.PI * 2);
  ctx.fill();

  // Streak Flame / Lightning glyph
  // Scale within safe zone: maskable requires staying within 80% circle (radius size * 0.4)
  const scale = isMaskable ? (size / 100) * 0.65 : (size / 100) * 0.75;
  ctx.save();
  ctx.translate(center, center);
  ctx.scale(scale, scale);

  // Draw elegant stylized flame shape
  ctx.fillStyle = '#2DD4BF';
  ctx.beginPath();
  // Centered flame path coordinates (-30 to +30)
  ctx.moveTo(0, -38);
  ctx.bezierCurveTo(12, -22, 28, -8, 28, 14);
  ctx.bezierCurveTo(28, 30, 16, 40, 0, 40);
  ctx.bezierCurveTo(-16, 40, -28, 30, -28, 14);
  ctx.bezierCurveTo(-28, 0, -18, -12, -10, -24);
  ctx.bezierCurveTo(-10, -14, -4, -6, 2, -6);
  ctx.bezierCurveTo(6, -6, 8, -12, 0, -38);
  ctx.closePath();
  ctx.fill();

  // Inner accent core
  ctx.fillStyle = '#F8FAFC';
  ctx.beginPath();
  ctx.moveTo(0, 10);
  ctx.bezierCurveTo(6, 10, 10, 16, 10, 24);
  ctx.bezierCurveTo(10, 31, 5, 34, 0, 34);
  ctx.bezierCurveTo(-5, 34, -10, 31, -10, 24);
  ctx.bezierCurveTo(-10, 16, -6, 10, 0, 10);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

drawIcon('c192', 192, false);
drawIcon('c512', 512, false);
drawIcon('cm192', 192, true);
drawIcon('cm512', 512, true);

// Expose data URLs on window for extraction
window.iconData = {
  i192: document.getElementById('c192').toDataURL('image/png'),
  i512: document.getElementById('c512').toDataURL('image/png'),
  m192: document.getElementById('cm192').toDataURL('image/png'),
  m512: document.getElementById('cm512').toDataURL('image/png')
};
</script>
</body>
</html>
