<!DOCTYPE html>
<html>
<body>
<iframe id="f" src="generate_icons.html"></iframe>
<pre id="out"></pre>
<script>
window.onload = () => {
  setTimeout(() => {
    const win = document.getElementById('f').contentWindow;
    document.getElementById('out').textContent = JSON.stringify(win.iconData);
  }, 400);
};
</script>
</body>
</html>
